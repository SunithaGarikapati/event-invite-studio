<script>
    document.getElementById('excelFile').addEventListener('change', handleFile, false);

    function handleFile(e) {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(evt) {
        const data = new Uint8Array(evt.target.result);
        const workbook = XLSX.read(data, {type: 'array'});
        
        // Read first sheet
        const firstSheetName = workbook.SheetNames[0];
        const worksheet = workbook.Sheets[firstSheetName];
        const json = XLSX.utils.sheet_to_json(worksheet);

        renderPartyData(json);
      };
      reader.readAsArrayBuffer(file);
    }

    // Helper function to find a field value regardless of exact key casing/formatting
    function getValueByKeyword(row, keywords) {
      const keys = Object.keys(row);
      for (let keyword of keywords) {
        const matchedKey = keys.find(k => k.toLowerCase().includes(keyword.toLowerCase()));
        if (matchedKey && row[matchedKey] !== undefined && row[matchedKey] !== '') {
          return row[matchedKey];
        }
      }
      return null;
    }

    function renderPartyData(data) {
      const tbody = document.getElementById('partyTableBody');
      tbody.innerHTML = '';

      let guestCount = 0;
      let dishCount = 0;
      let dietaryCount = 0;

      data.forEach(row => {
        // Robust key matching searching by key fragments
        const name = getValueByKeyword(row, ['guest', 'name']) || 'Guest';
        const dish = getValueByKeyword(row, ['dish', 'bringing', 'item']) || 'TBD';
        const category = getValueByKeyword(row, ['category']) || 'General';
        const dietary = getValueByKeyword(row, ['dietary', 'vegan', 'gf', 'tag']) || '-';

        // Count metrics
        if (name && name !== 'Guest') guestCount++;
        if (dish && dish !== 'TBD' && dish !== '-') dishCount++;
        if (dietary && dietary !== '-' && dietary !== 'None') dietaryCount++;

        const tr = document.createElement('tr');
        tr.className = 'hover:bg-slate-50 transition';
        tr.innerHTML = `
          <td class="py-3 px-4 font-semibold text-slate-800">${name}</td>
          <td class="py-3 px-4 text-slate-600">${dish}</td>
          <td class="py-3 px-4"><span class="bg-indigo-50 text-indigo-700 text-xs px-2.5 py-1 rounded-full font-medium">${category}</span></td>
          <td class="py-3 px-4"><span class="bg-amber-50 text-amber-700 text-xs px-2.5 py-1 rounded-full font-medium">${dietary}</span></td>
        `;
        tbody.appendChild(tr);
      });

      // Update KPIs
      document.getElementById('totalGuests').innerText = guestCount || data.length;
      document.getElementById('totalDishes').innerText = dishCount;
      document.getElementById('totalDietary').innerText = dietaryCount;

      // Unhide sections
      document.getElementById('dashboard').classList.remove('hidden');
      document.getElementById('tableContainer').classList.remove('hidden');
    }
  </script>
